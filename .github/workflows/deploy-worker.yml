name: Desplegar Worker online

# Despliega online/worker.js en Cloudflare al cambiar archivos de online/,
# o a mano desde Actions → "Desplegar Worker online" → Run workflow.
# Requiere los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID del repositorio.
on:
  push:
    branches: [main]
    paths: ['online/**']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: online
          command: deploy --config wrangler.jsonc
